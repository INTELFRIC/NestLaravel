<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:url" content="{{canonical}}"><meta property="og:site_name" content="NestLaravel">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
{{header}}
<main id="main" class="wrap docs">
  <aside class="sidebar" aria-label="Documentation">{{sidebar}}</aside>
  <article class="doc">
    <div class="crumb">{{group}} &rsaquo; {{label}}</div>
    <h1>{{pageTitle}}</h1>
    {{content}}
    <a class="edit" href="{{editUrl}}" rel="noopener">Edit this page on GitHub</a>
    <div class="pager">{{prev}}{{next}}</div>
  </article>
  <aside class="toc" aria-label="On this page"><h2>On this page</h2><ul>{{toc}}</ul></aside>
</main>
{{footer}}
<script src="/assets/site.js" defer></script>
</body>
</html>
