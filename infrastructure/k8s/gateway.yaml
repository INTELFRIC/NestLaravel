# The gateway is a LOGICAL component: run as many replicas as you need behind a load balancer.
# It keeps no correctness-critical state in process memory. Rate-limit counters, circuit-breaker state and HMAC nonces
# live in the SHARED cache — so CACHE_STORE must be redis (or database), never array/file, when replicas > 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: nestlaravel }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: gateway } }
  template:
    metadata: { labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: nestlaravel } }
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:               # spread across nodes/zones so one failure does not remove the front door
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
      containers:
        - name: web
          image: ghcr.io/REPLACE_ME/gateway:1.0.0
          ports: [{ name: http, containerPort: 80 }]
          envFrom: [{ configMapRef: { name: gateway-config } }, { secretRef: { name: gateway-secrets } }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }
          startupProbe: { httpGet: { path: /up, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, timeoutSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 2 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 8"] } } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: ClusterIP                               # expose through your Ingress / cloud load balancer with TLS
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gateway }
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: gateway } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gateway }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
