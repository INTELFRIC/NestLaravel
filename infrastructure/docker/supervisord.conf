[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=10MB

; Graceful shutdown (docker stop / Kubernetes SIGTERM):
;   supervisord forwards the stop signal to each program and waits up to stopwaitsecs for a clean exit.
;   php-fpm: SIGQUIT = graceful (finish in-flight requests); nginx: SIGQUIT = graceful (drain connections).
;   Keep stopwaitsecs BELOW terminationGracePeriodSeconds / docker stop -t so nothing is SIGKILLed mid-request.

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off; worker_shutdown_timeout 30s;"
autostart=true
autorestart=true
priority=20
stopsignal=QUIT
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
